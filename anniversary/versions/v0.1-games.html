  .btn-new {

<script>
  // Function to open a game in a fullscreen iframe
  function openGame(url) {
    const win = window.open('about:blank', '_blank');
    const iframe = win.document.createElement('iframe');
    iframe.style.position = "fixed";
    iframe.style.top = 0;
    iframe.style.left = 0;
    iframe.style.width = "100%";
    iframe.style.height = "100%";
    iframe.style.border = "none";
    iframe.src = url.startsWith("http") ? url : "https://" + url;
    win.document.body.style.margin = "0";
    win.document.body.appendChild(iframe);
  }

  // Check if the user is authorized in localStorage
  const authorized = localStorage.getItem("userAuthorized") === "true";
  if (authorized) {
    // Hide the overlay so the construction zone is interactive
    const overlay = document.querySelector(".construction-overlay");
    if (overlay) {
      overlay.style.display = "none";
    }
    // Enable pointer events on construction zone children
    const zoneChildren = document.querySelectorAll(".construction-zone *");
    zoneChildren.forEach(el => el.style.pointerEvents = "auto");
  }
</script>
